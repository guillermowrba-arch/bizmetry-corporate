<svg viewBox="0 0 360 260" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec407a"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="360" height="260" rx="18" fill="url(#bgGrad)"/>

  <g filter="url(#softShadow)">
    <rect x="34" y="40" width="292" height="160" rx="14" fill="#fff" stroke="#f8bbd0" stroke-width="1.5"/>
  </g>

  <g transform="translate(58,70)">
    <circle cx="44" cy="44" r="44" fill="#ffe3ed" stroke="#f8bbd0"/>
    <circle cx="44" cy="40" r="18" fill="#f48fb1"/>
    <rect x="18" y="66" width="52" height="22" rx="11" fill="#f48fb1" opacity="0.2"/>
    <g transform="translate(72,56)">
      <circle cx="20" cy="20" r="20" fill="url(#accentGrad)"/>
      <rect x="18" y="10" width="4" height="20" rx="2" fill="#fff"/>
      <rect x="10" y="18" width="20" height="4" rx="2" fill="#fff"/>
    </g>
  </g>

  <g transform="translate(170,78)">
    <rect x="0" y="0" width="110" height="10" rx="5" fill="#ec407a" opacity="0.85"/>
    <rect x="0" y="24" width="150" height="8" rx="4" fill="#f8bbd0"/>
    <rect x="0" y="44" width="132" height="8" rx="4" fill="#f8bbd0"/>
    <rect x="0" y="64" width="160" height="8" rx="4" fill="#f8bbd0"/>
    <rect x="0" y="84" width="118" height="8" rx="4" fill="#f8bbd0"/>
  </g>

  <g opacity="0.9">
    <circle cx="300" cy="48" r="3" fill="#ec407a"/>
    <circle cx="316" cy="60" r="2.5" fill="#f06292"/>
    <circle cx="286" cy="58" r="2" fill="#f48fb1"/>
  </g>
