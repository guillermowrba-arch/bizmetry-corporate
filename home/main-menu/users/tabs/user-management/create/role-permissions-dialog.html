<head>
  <link rel="stylesheet" href="/home/main-menu/users/tabs/user-management/create/role-permissions-dialog.css">
</head>

<md-dialog aria-label="Role Permissions" class="permissions-dialog">
    
    <!-- HEADER -->
    <md-toolbar>
        <div class="md-toolbar-tools">
            <md-icon>security</md-icon>
            <h2>{{role.name}} - Permissions</h2>
            <span flex></span>
            <div style="display: flex; align-items: center; gap: 16px;">
                <span class="permissions-count-badge">
                    <md-icon>verified_user</md-icon>
                    {{getFilteredPermissions().length}} / {{role.authorizations.length}} permissions
                </span>
                <md-button class="md-icon-button" ng-click="close()" aria-label="Close">
                    <md-icon>close</md-icon>
                </md-button>
            </div>
        </div>
    </md-toolbar>

    <!-- SEARCH BAR -->
    <div class="permissions-search-bar">
        <md-icon class="search-icon">search</md-icon>
        <input type="text" 
               class="search-input"
               ng-model="searchQuery"
               placeholder="Search permissions by name or description..."
               autofocus>
        <md-button class="md-icon-button search-clear-btn" 
                   ng-if="searchQuery && searchQuery.length > 0"
                   ng-click="clearSearch()"
                   aria-label="Clear search">
            <md-icon>close</md-icon>
        </md-button>
    </div>

    <!-- CONTENT -->
    <md-dialog-content>
        <!-- No results message -->
        <div ng-if="getFilteredPermissions().length === 0" class="no-results">
            <md-icon>search_off</md-icon>
            <p>No permissions found matching "{{searchQuery}}"</p>
        </div>
        
        <!-- Permissions list -->
        <md-list class="permissions-list" ng-if="getFilteredPermissions().length > 0">
            <md-list-item class="permission-item" ng-repeat="auth in getFilteredPermissions()">
                <div class="permission-icon">
                    <md-icon>check_circle</md-icon>
                </div>
                <div class="permission-content">
                    <div class="permission-name">{{auth.name}}</div>
                    <div class="permission-description">{{auth.description}}</div>
                </div>
            </md-list-item>
        </md-list>
    </md-dialog-content>

    <!-- FOOTER -->
    <md-dialog-actions layout="row" layout-align="end center">
        <md-button ng-click="close()" class="md-raised md-primary">
            <md-icon>close</md-icon>
            Close
        </md-button>
    </md-dialog-actions>

</md-dialog>
