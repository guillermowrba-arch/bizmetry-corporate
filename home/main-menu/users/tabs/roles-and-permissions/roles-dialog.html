<head>
    <link rel="stylesheet" href="/home/main-menu/users/tabs/roles-and-permissions/roles-dialog.css">
</head>
<!-- ROLES & PERMISSIONS TAB CONTENT -->
<div class="roles-permissions-content">

    <!-- Barra de acciones superiores -->
    <div layout="row" layout-align="space-between center" style="margin-bottom: 20px;">
        <div layout="row" layout-align="start center">
            <!-- Estadísticas de roles -->
            <md-card class="roles-stats-card stat-roles">
                <div layout="row" layout-align="start center">
                    <md-icon>security</md-icon>
                    <div>
                        <div class="stat-value">{{getTotalRolesCount()}}</div>
                        <div class="stat-label">Total Roles</div>
                    </div>
                </div>
            </md-card>

            <md-card class="roles-stats-card stat-permissions">
                <div layout="row" layout-align="start center">
                    <md-icon>vpn_key</md-icon>
                    <div>
                        <div class="stat-value">{{getTotalPermissionsCount()}}</div>
                        <div class="stat-label">Permissions</div>
                    </div>
                </div>
            </md-card>
        </div>

        <div layout="row" layout-align="end center">
            <md-button class="md-raised roles-expand-button" ng-click="expandAll()">
                <md-icon>unfold_more</md-icon>
                Expand All
            </md-button>
            <md-button class="md-raised roles-collapse-button" ng-click="collapseAll()" style="margin-left: 8px;">
                <md-icon>unfold_less</md-icon>
                Collapse All
            </md-button>
         </div>
    </div>

    <!-- Loading State -->
    <div ng-if="loading" layout="row" layout-align="center center" style="min-height: 400px; width: 100%;">
        <md-progress-circular md-mode="indeterminate" md-diameter="60" class="tab-loading-spinner">
        </md-progress-circular>
    </div>

    <!-- Árbol de Roles y Permisos -->
    <div ng-if="!loading && rolesHierarchy.length > 0" style="width: 100%;">
        <md-card class="roles-tree-card">
            <md-card-content>
                <div class="roles-tree-container">
                    <!-- Template recursivo para el árbol -->
                    <script type="text/ng-template" id="role-tree-node.html">
                        <div class="role-tree-node">
                            <!-- Nodo del Rol -->
                            <div class="role-node-header" 
                                 ng-style="{'padding-left': (level * 24) + 'px'}" 
                                 ng-click="toggleNode(role.id)">
                                
                                <!-- Icono expandir/colapsar -->
                                <md-icon class="expand-icon" ng-if="(role.childRoles && role.childRoles.length > 0) || (role.permissions && role.permissions.length > 0)">
                                    {{isNodeExpanded(role.id) ? 'expand_more' : 'chevron_right'}}
                                </md-icon>
                                <span class="expand-icon-placeholder" ng-if="(!role.childRoles || role.childRoles.length === 0) && (!role.permissions || role.permissions.length === 0)"></span>

                                <!-- Icono de rol -->
                                <md-icon class="role-icon">security</md-icon>

                                <!-- Información del rol -->
                                <div class="role-info" flex>
                                    <div class="role-name">{{role.name}}</div>
                                    <div class="role-description" ng-if="role.description">{{role.description}}</div>
                                </div>

                                <!-- Badges de conteo -->
                                <div class="role-badges">
                                    <span class="badge badge-roles" ng-if="role.childRoles && role.childRoles.length > 0">
                                        <md-icon>security</md-icon>
                                        {{getChildRolesCountForRole(role)}}
                                    </span>
                                    <span class="badge badge-permissions" ng-if="getPermissionsCountForRole(role) > 0">
                                        <md-icon>vpn_key</md-icon>
                                        {{getPermissionsCountForRole(role)}}
                                    </span>
                                </div>
                            </div>

                            <!-- Contenido expandible -->
                            <div class="role-node-content" ng-if="isNodeExpanded(role.id)">
                                <!-- Child Roles (primero) -->
                                <div ng-if="role.childRoles && role.childRoles.length > 0" 
                                     ng-repeat="childRole in role.childRoles"
                                     ng-include="'role-tree-node.html'"
                                     ng-init="role = childRole; level = level + 1">
                                </div>

                                <!-- Permissions (después de los roles) -->
                                <div ng-if="role.permissions && role.permissions.length > 0" class="permissions-list">
                                    <div class="permission-node" 
                                         ng-repeat="permission in role.permissions" 
                                         ng-style="{'padding-left': ((level + 1) * 24) + 'px'}"
                                         ng-click="onPermissionClick(permission)">
                                        
                                        <!-- Placeholder para alineación -->
                                        <span class="expand-icon-placeholder"></span>

                                        <!-- Icono de permiso -->
                                        <md-icon class="permission-icon">vpn_key</md-icon>

                                        <!-- Información del permiso -->
                                        <div class="permission-info" flex>
                                            <div class="permission-name">{{permission.name}}</div>
                                            <div class="permission-description" ng-if="permission.description">{{permission.description}}</div>
                                        </div>

                                        <!-- ID del permiso -->
                                        <div class="permission-id">
                                            <code>{{permission.id}}</code>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </script>

                    <!-- Renderizar árbol desde la raíz -->
                    <div ng-repeat="role in rolesHierarchy" ng-include="'role-tree-node.html'" ng-init="level = 0">
                    </div>
                </div>
            </md-card-content>
        </md-card>
    </div>

    <!-- Empty State -->
    <div ng-if="!loading && rolesHierarchy.length === 0" style="width: 100%;">
        <md-card class="roles-list-card">
            <md-card-content>
                <div layout="row" layout-align="center center" style="padding: 60px 20px;">
                    <div style="text-align: center; max-width: 500px;">
                        <md-icon style="font-size: 72px; width: 72px; height: 72px; color: #ccc; margin-bottom: 20px;">
                            security
                        </md-icon>
                        <h3 style="color: #666; margin: 0 0 10px 0;">No Roles Found</h3>
                        <p style="color: #999; margin: 0;">
                            Get started by creating your first role with custom permissions.
                        </p>
                        <md-button class="md-raised md-primary" ng-click="createNewRole()" style="margin-top: 20px;">
                            <md-icon>add</md-icon>
                            Create First Role
                        </md-button>
                    </div>
                </div>
            </md-card-content>
        </md-card>
    </div>

</div>
